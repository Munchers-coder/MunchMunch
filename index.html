  });
}

function drawPlayer() {
  const r=player.radius;
  const wb=player.wobble;
  const wobbleX=1+Math.sin(Date.now()*0.022)*wb*0.15;
  const wobbleY=1-Math.sin(Date.now()*0.022)*wb*0.15;
  const blink=player.invincible>0&&Math.floor(Date.now()/75)%2===0;
  if(blink) return;

  const sw = SWATCHES[selectedSwatch];
  ctx.save(); ctx.translate(player.x,player.y);
  ctx.shadowColor=sw.l; ctx.shadowBlur=22;

  drawPlayerBody(r, wobbleX, wobbleY, sw);

  // Eyes
  ctx.shadowBlur=0;
  const ex=Math.cos(player.angle)*r*0.34, ey=Math.sin(player.angle)*r*0.34;
  const esp=r*0.27;
  const px=-Math.sin(player.angle)*esp, py=Math.cos(player.angle)*esp;
  for(let s=-1;s<=1;s+=2){
    const ex2=ex+px*s, ey2=ey+py*s;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex2,ey2,r*0.17,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(ex2+Math.cos(player.angle)*r*0.05,ey2+Math.sin(player.angle)*r*0.05,r*0.085,0,Math.PI*2); ctx.fill();
  }

  // Hat
  if (equippedHat === 'crown' || equippedHat === 'tophat' || equippedHat === 'monkey') {
    const EMOJI = { crown:'👑', tophat:'🎩', monkey:'🐵' };
    ctx.font = `${r * 1.2}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.fillText(EMOJI[equippedHat], 0, -r * 0.75);
  } else if (equippedHat === 'party') {
    // Draw a party hat cone
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0, -r * 1.55);
    ctx.lineTo(-r * 0.45, -r * 0.75);
    ctx.lineTo(r * 0.45, -r * 0.75);
    ctx.closePath();
    ctx.fillStyle = '#f43f5e'; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r * 0.06; ctx.stroke();
    // stripes
    ctx.beginPath(); ctx.moveTo(-r*0.15, -r*1.35); ctx.lineTo(r*0.15, -r*1.35);
    ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = r*0.08; ctx.stroke();
    // pom pom
    ctx.beginPath(); ctx.arc(0, -r*1.55, r*0.12, 0, Math.PI*2);
    ctx.fillStyle = '#fbbf24'; ctx.fill();
    ctx.restore();
  } else if (equippedHat === 'chef') {
    // Draw a white chef hat
    ctx.save();
    // brim
    ctx.beginPath(); ctx.roundRect(-r*0.5, -r*0.95, r, r*0.2, r*0.05);
    ctx.fillStyle = '#fff'; ctx.fill();
    // puff top
    ctx.beginPath(); ctx.arc(0, -r*1.25, r*0.38, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.restore();
  }

  // Mouth
  ctx.strokeStyle='#fff'; ctx.lineWidth=r*0.075; ctx.lineCap='round';
  const mx2=Math.cos(player.angle)*r*0.44, my2=Math.sin(player.angle)*r*0.44;
  ctx.beginPath();
  if(player.wobble>0.1){
    ctx.arc(mx2,my2,r*0.23,player.angle-0.6,player.angle+0.6);
    ctx.fillStyle='#ff6b6b'; ctx.fill();
  } else {
    ctx.arc(mx2,my2,r*0.23,player.angle-0.5,player.angle+0.5); ctx.stroke();
  }
  ctx.restore();
}

// ── Menu ──────────────────────────────────────────────────────
// ── FOOD RUN MODE ─────────────────────────────────────────────
let fr = {};
const FR_VEG_EMOJIS  = ['🥦','🥕','🌽','🧅','🥒','🍆','🧄','🥬','🌶️','🥑'];
const FR_OBS_EMOJIS  = ['🥦','🥕','🌽','🧅','🥒','🍆'];

function startFoodRun() {
  gameMode = 'foodrun';
  gameState = 'playing';
  timerStat.style.display = 'none';
  stopMusic();
  const gap = H * 0.30;
  fr = {
    speed: 4.5,
    playerY: H * 0.5,
    playerVY: 0,
    chaserX: -60,
    distance: 0,
    obstacles: [],
    floaters: [],
    spawnTimer: 0,
    spawnInterval: 150,
    lastGapCenter: H * 0.5,
    particles: [],
    dead: false,
    deathTimer: 0,
    bestDistance: fr.bestDistance || 0,
    gapSize: gap,
    neverHit: true,
    passedFirst: false,
  };
}

function updateFoodRun(dt) {
  if (fr.dead) {
    fr.deathTimer++;
    if (fr.deathTimer > 120) { gameState = 'menu'; stopMusic(); resetHint(); }
    return;
  }

  // Increase speed over time
  fr.speed = Math.min(10, 4.5 + fr.distance * 0.0012);
  fr.distance += fr.speed;

  // Player vertical movement
  const moveSpeed = 4.5 + (fr.speed - 4.5) * 0.6;
  const accel = 0.8 + (fr.speed - 4.5) * 0.1;
  if (keys['ArrowUp'] || keys['w'] || keys['W'])   fr.playerVY = Math.max(-moveSpeed, fr.playerVY - accel);
  if (keys['ArrowDown'] || keys['s'] || keys['S']) fr.playerVY = Math.min(moveSpeed,  fr.playerVY + accel);
  // friction when no key held
  if (!keys['ArrowUp'] && !keys['w'] && !keys['W'] && !keys['ArrowDown'] && !keys['s'] && !keys['S']) fr.playerVY *= 0.75;
  fr.playerY = Math.max(30, Math.min(H - 30, fr.playerY + fr.playerVY));

  // Mobile touch: top half = up, bottom half = down
  if (mobileMode && fr.touchUp)   fr.playerVY = Math.max(-moveSpeed, fr.playerVY - accel);
  if (mobileMode && fr.touchDown) fr.playerVY = Math.min(moveSpeed,  fr.playerVY + accel);

  // Chaser moves right, catching up as speed increases
  const chaserSpeed = fr.speed * 0.88;
  fr.chaserX += chaserSpeed;
  const playerScreenX = W * 0.22;
  const chaserTarget = playerScreenX - 80;
  if (fr.chaserX > chaserTarget) fr.chaserX = chaserTarget;
  // Chaser can never actually reach the player
  if (fr.chaserX > playerScreenX - 55) fr.chaserX = playerScreenX - 55;

  // Spawn obstacles
  fr.spawnTimer++;
  fr.spawnInterval = Math.max(70, 160 - fr.distance * 0.05);
  if (fr.spawnTimer >= fr.spawnInterval) {
    fr.spawnTimer = 0;
    const gapSize = Math.max(H * 0.22, fr.gapSize - fr.distance * 0.015);
    const maxShift = H * 0.28;
    const rawCenter = H * 0.15 + Math.random() * H * 0.7;
    const gapCenter = Math.max(Math.min(fr.lastGapCenter + maxShift, rawCenter), fr.lastGapCenter - maxShift);
    const clampedCenter = Math.max(gapSize/2 + 20, Math.min(H - gapSize/2 - 20, gapCenter));
    fr.lastGapCenter = clampedCenter;
    const veg = () => FR_OBS_EMOJIS[Math.floor(Math.random()*FR_OBS_EMOJIS.length)];
    const emojis = Array.from({length:14}, veg);

    const types = ['column','ring','snake','spinner','zigzag'];
    const available = fr.distance < 400 ? ['column','ring'] : types;
    const type = available[Math.floor(Math.random()*available.length)];

    if (type === 'column') {
      // Classic gap wall
      fr.obstacles.push({ type:'column', x:W+40, gapCenter:clampedCenter, gapSize, emojis });

    } else if (type === 'ring') {
      // Ring of veggies — fly through the hole in the middle
      const ringR = Math.min(H*0.28, gapSize*0.9);
      fr.obstacles.push({ type:'ring', x:W+60, cx:W+60, cy:clampedCenter,
        r:ringR, count:10, angle:0, emoji:veg() });

    } else if (type === 'snake') {
      // A row of veggies that oscillates up and down — dodge above or below
      const snakeY = H*0.2 + Math.random()*H*0.6;
      const count = 6 + Math.floor(Math.random()*4);
      fr.obstacles.push({ type:'snake', x:W+40, baseY:H/2, count,
        phase: Math.random()*Math.PI*2, amp: H*0.40, emoji:veg() });

    } else if (type === 'spinner') {
      // Veggies spinning around a center — weave through the gaps
      const spinCy = H*0.25 + Math.random()*H*0.5;
      fr.obstacles.push({ type:'spinner', x:W+60, cx:W+60, cy:spinCy,
        r:H*0.30, count:5, angle:Math.random()*Math.PI*2,
        speed:0.04+Math.random()*0.03, emoji:veg() });

    } else if (type === 'zigzag') {
      // Diagonal rows of veggies with gaps to squeeze through
      const dir = Math.random()<0.5 ? 1 : -1;
      fr.obstacles.push({ type:'zigzag', x:W+40, dir, phase:0, emoji:veg() });
    }
  }

  // Update & move obstacles
  const now = Date.now();
  fr.obstacles.forEach(o => {
    o.x -= fr.speed;
    if (o.cx !== undefined) o.cx -= fr.speed;
    if ((o.cx ?? o.x) < W * 0.22 - 40) fr.passedFirst = true;
    if (o.type === 'spinner') o.angle += o.speed;
    if (o.type === 'snake')   o.phase += 0.04;
    if (o.type === 'zigzag')  o.phase += 0.05;
    if (o.type === 'ring')    o.angle += 0.03;
  });
  fr.obstacles = fr.obstacles.filter(o => (o.cx ?? o.x) > -120);
  fr.floaters.forEach(f => { f.x -= fr.speed; f.y += f.vy; if (f.y<20||f.y>H-20) f.vy*=-1; });
  fr.floaters = fr.floaters.filter(f => f.x > -60);

  const pr = 18;
  const px = playerScreenX;
  const py = fr.playerY;
  let hit = false;

  for (const o of fr.obstacles) {
    if (o.type === 'column') {
      if (Math.abs(o.x - px) < pr + 20) {
        const topEnd = o.gapCenter - o.gapSize/2, botStart = o.gapCenter + o.gapSize/2;
        if (py - pr < topEnd || py + pr > botStart) { hit = true; break; }
      }
    } else if (o.type === 'ring') {
      if (Math.abs(o.cx - px) < o.r + pr + 14) {
        // Must be inside the ring hole; veggies are on the ring edge
        const distToCenter = Math.hypot(px - o.cx, py - o.cy);
        // Check if player is near any of the ring veggies
        for (let i = 0; i < o.count; i++) {
          const a = o.angle + (i / o.count) * Math.PI * 2;
          const vx = o.cx + Math.cos(a) * o.r, vy = o.cy + Math.sin(a) * o.r;
          if (Math.hypot(px - vx, py - vy) < pr + 16) { hit = true; break; }
        }
        if (hit) break;
      }
    } else if (o.type === 'snake') {
      for (let i = 0; i < o.count; i++) {
        const sx = o.x + i * 38, sy = o.baseY + Math.sin(o.phase + i * 0.7) * o.amp;
        if (Math.hypot(px - sx, py - sy) < pr + 16) { hit = true; break; }
      }
      if (hit) break;
    } else if (o.type === 'spinner') {
      for (let i = 0; i < o.count; i++) {
        const a = o.angle + (i / o.count) * Math.PI * 2;
        const vx = o.cx + Math.cos(a) * o.r, vy = o.cy + Math.sin(a) * o.r;
        if (Math.hypot(px - vx, py - vy) < pr + 16) { hit = true; break; }
      }
      if (hit) break;
    } else if (o.type === 'zigzag') {
      for (let i = 0; i < 8; i++) {
        const zx = o.x + i * 44;
        const zy = H/2 + Math.sin(o.phase + i * 1.1) * H * 0.43 * o.dir;
        if (Math.hypot(px - zx, py - zy) < pr + 16) { hit = true; break; }
        // second row offset
        const zy2 = H/2 - Math.sin(o.phase + i * 1.1 + Math.PI) * H * 0.43 * o.dir;
        if (Math.hypot(px - zx, py - zy2) < pr + 16) { hit = true; break; }
      }
      if (hit) break;
    }
  }

  if (!hit) {
    for (const f of fr.floaters) {
      if (Math.hypot(f.x - px, f.y - py) < pr + 14) { hit = true; break; }
    }
  }

  if (hit) {
    fr.dead = true; fr.deathTimer = 0;
    if (fr.distance > fr.bestDistance) fr.bestDistance = fr.distance;
    if (!fr.passedFirst) unlockAchievement('i_love_veggies');
    fr.neverHit = false;
    setTimeout(() => openFoodRunLeaderboard(fr.distance), 1400);
    for (let i=0;i<20;i++) fr.particles.push({ x:px, y:py, vx:(Math.random()-0.5)*6, vy:(Math.random()-0.5)*6, life:1, color:`hsl(${Math.random()*360},90%,60%)` });
    return;
  }


  // Distance achievements
  if (fr.distance >= 5000)  unlockAchievement('fr_500');
  if (fr.distance >= 10000) unlockAchievement('fr_1000');
  if (fr.distance >= 20000) unlockAchievement('fr_2000');

  // Particles
  fr.particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.life-=0.04; });
  fr.particles = fr.particles.filter(p=>p.life>0);
}

function drawFoodRun() {
  // Background
  ctx.fillStyle = '#0f0f23';
  ctx.fillRect(0,0,W,H);

  // Scrolling grid lines for speed feel
  ctx.strokeStyle = 'rgba(100,100,200,0.12)';
  ctx.lineWidth = 1;
  const lineSpacing = 80;
  const offset = (fr.distance * 1.2) % lineSpacing;
  for (let x = -offset; x < W + lineSpacing; x += lineSpacing) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y = 0; y < H; y += lineSpacing) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  // Draw all obstacles
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  fr.obstacles.forEach(o => {
    if (o.type === 'column') {
      const topEnd = o.gapCenter - o.gapSize/2, botStart = o.gapCenter + o.gapSize/2;
      ctx.font = '28px serif';
      let y = 14, idx = 0;
      while (y < topEnd - 14) { ctx.fillText(o.emojis[idx%o.emojis.length], o.x, y); y+=28; idx++; }
      y = botStart + 14;
      while (y < H+28) { ctx.fillText(o.emojis[idx%o.emojis.length], o.x, y); y+=28; idx++; }
      // arrow hints
      ctx.font = '16px serif'; ctx.globalAlpha = 0.4;
      ctx.fillText('→', o.x-36, o.gapCenter);
      ctx.globalAlpha = 1;

    } else if (o.type === 'ring') {
      ctx.font = '28px serif';
      for (let i = 0; i < o.count; i++) {
        const a = o.angle + (i/o.count)*Math.PI*2;
        ctx.fillText(o.emoji, o.cx + Math.cos(a)*o.r, o.cy + Math.sin(a)*o.r);
      }
      // hole indicator
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2; ctx.setLineDash([4,6]);
      ctx.beginPath(); ctx.arc(o.cx, o.cy, o.r*0.45, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();

    } else if (o.type === 'snake') {
      ctx.font = '30px serif';
      for (let i = 0; i < o.count; i++) {
        const sx = o.x + i*38, sy = o.baseY + Math.sin(o.phase + i*0.7)*o.amp;
        ctx.fillText(o.emoji, sx, sy);
      }

    } else if (o.type === 'spinner') {
      ctx.font = '30px serif';
      for (let i = 0; i < o.count; i++) {
        const a = o.angle + (i/o.count)*Math.PI*2;
        ctx.fillText(o.emoji, o.cx + Math.cos(a)*o.r, o.cy + Math.sin(a)*o.r);
      }
      // faint orbit circle
      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,100,0.12)';
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(o.cx, o.cy, o.r, 0, Math.PI*2); ctx.stroke();
      ctx.restore();

    } else if (o.type === 'zigzag') {
      ctx.font = '28px serif';
      for (let i = 0; i < 8; i++) {
        const zx = o.x + i*44;
        ctx.fillText(o.emoji, zx, H/2 + Math.sin(o.phase + i*1.1)*H*0.43*o.dir);
        ctx.fillText(o.emoji, zx, H/2 - Math.sin(o.phase + i*1.1 + Math.PI)*H*0.43*o.dir);
      }
    }
  });

  // Draw floaters
  fr.floaters.forEach(f => {
    ctx.font = `${f.size}px serif`;
    ctx.fillText(f.emoji, f.x, f.y);
  });

  // Chaser — rolling veggie cluster
  const chaserEmojis = FR_VEG_EMOJIS;
  const cr = 48 + Math.sin(Date.now()*0.008)*4;
  ctx.save();
  ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 30;
  for (let i = 0; i < 8; i++) {
    const angle = (Date.now() * 0.003 + i * Math.PI * 2/8);
    const ex = fr.chaserX + Math.cos(angle) * cr * 0.6;
    const ey = H/2 + Math.sin(angle) * cr * 0.5;
    ctx.font = '28px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(chaserEmojis[i % chaserEmojis.length], ex, ey);
  }
  ctx.font = '38px serif';
  ctx.fillText(chaserEmojis[Math.floor(Date.now()/300) % chaserEmojis.length], fr.chaserX, H/2);
  ctx.restore();

  // Warning flash when chaser is close
  const px = W * 0.22;
  const dist = px - fr.chaserX;
  if (dist < 140 && !fr.dead) {
    ctx.fillStyle = `rgba(255,0,0,${0.12*(1-(dist/140))*(Math.sin(Date.now()*0.02)*0.5+0.5)})`;
    ctx.fillRect(0,0,W,H);
  }

  // Player blob
  if (!fr.dead || Math.floor(fr.deathTimer/6)%2===0) {
    const sw = SWATCHES[selectedSwatch];
    ctx.save();
    ctx.translate(px, fr.playerY);
    ctx.shadowColor = sw.l; ctx.shadowBlur = 18;
    ctx.fillStyle = sw.d;
    ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = sw.l;
    ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI*2); ctx.fill();
    // eyes
    ctx.shadowBlur = 0;
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6,-4,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6,4,4,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(8,-4,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(8,4,2,0,Math.PI*2); ctx.fill();
    // hat
    if (equippedHat === 'crown' || equippedHat === 'tophat' || equippedHat === 'monkey') {
      const EMOJI = { crown:'👑', tophat:'🎩', monkey:'🐵' };
      ctx.font='22px serif'; ctx.textAlign='center'; ctx.textBaseline='bottom';
      ctx.fillText(EMOJI[equippedHat], 0, -14);
    }
    ctx.restore();
  }

  // Death particles
  fr.particles.forEach(p => {
    ctx.save(); ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, 6*p.life, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // HUD
  ctx.fillStyle='#fff'; ctx.font='bold 20px Segoe UI';
  ctx.textAlign='left'; ctx.textBaseline='top';
  ctx.shadowColor='#000'; ctx.shadowBlur=8;
  ctx.fillText(`🏃 ${Math.floor(fr.distance)}m`, 12, 50);
  if (fr.bestDistance > 0) {
    ctx.font='14px Segoe UI'; ctx.fillStyle='#aaa';
    ctx.fillText(`Best: ${Math.floor(fr.bestDistance)}m`, 12, 74);
  }
  ctx.shadowBlur=0;

  // Speed indicator
  const speedPct = (fr.speed - 2.8) / (10 - 2.8);
  ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(W-14, 50, 10, H-100);
  ctx.fillStyle=`hsl(${120-speedPct*120},90%,50%)`;
  const barH = (H-100) * Math.min(1, speedPct);
  ctx.fillRect(W-14, H-50-barH, 10, barH);
  ctx.font='10px Segoe UI'; ctx.fillStyle='#888'; ctx.textAlign='center';
  ctx.fillText('SPD', W-9, 45);

  // Death screen
  if (fr.dead) {
    ctx.fillStyle=`rgba(0,0,0,${Math.min(0.7, fr.deathTimer*0.01)})`;
    ctx.fillRect(0,0,W,H);
    if (fr.deathTimer > 20) {
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='bold 40px Segoe UI'; ctx.fillStyle='#ff4444';
      ctx.shadowColor='#ff4444'; ctx.shadowBlur=20;
      ctx.fillText('CAUGHT!', W/2, H/2-40);
      ctx.shadowBlur=0;
      ctx.font='24px Segoe UI'; ctx.fillStyle='#fff';
      ctx.fillText(`${Math.floor(fr.distance)}m`, W/2, H/2+10);
      ctx.font='16px Segoe UI'; ctx.fillStyle='#aaa';
      ctx.fillText('Returning to menu...', W/2, H/2+50);
    }
  }

  // Mobile controls hint
  if (mobileMode && !fr.dead && fr.distance < 300) {
    ctx.fillStyle='rgba(255,255,255,0.25)';
    ctx.font='13px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('▲ tap top / ▼ tap bottom', W/2, H-20);
  }
}

// ── Ending cutscene update + draw ────────────────────────────
function updateEndingCutscene() {
  const c = endingCutscene;
  c.timer++;
  c.blobAngle += 0.02;
  c.vortexAngle += 0.06;

  if (c.phase === 0) {
    // grow blob toward full-screen (scale 1 = fills canvas)
    c.blobScale = Math.min(1, c.blobScale + 0.0022);
    if (c.timer >= 360) c.phase = 1;
  } else if (c.phase === 1) {
    // vortex — spin faster, shrink blob into vortex center
    c.vortexAngle += 0.1;
    c.blobScale = Math.max(0, c.blobScale - 0.012);
    if (c.timer >= 560) { c.phase = 2; c.blobScale = 0.04; }
  } else if (c.phase === 2) {
    // new world: blob stays tiny, world expands around it
    if (c.timer >= 760) { c.phase = 3; pt2Unlocked = true; unlockAchievement('true_ending'); saveProgress(); }
  }
}

function drawEndingCutscene() {
  const c = endingCutscene;
  const t = c.timer;
  const phase = c.phase;
  const cx = W/2, cy = H/2;

  // ── Phase 0: blob eating food ──────────────────────────────
  if (phase === 0) {
    // cosmic dark bg
    ctx.fillStyle = '#050510'; ctx.fillRect(0,0,W,H);
    // subtle nebula glow behind blob
    const nebula = ctx.createRadialGradient(cx,cy,0,cx,cy,W*0.6*c.blobScale+80);
    nebula.addColorStop(0,'rgba(108,99,255,0.18)');
    nebula.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=nebula; ctx.fillRect(0,0,W,H);

    // flying food moving inward
    c.flyingFood.forEach(f => {
      if (t < f.delay) return;
      const progress = Math.min(1, (t - f.delay) / 180);
      const eased = 1 - Math.pow(1 - progress, 3);
      const fx = f.x + (cx - f.x) * eased;
      const fy = f.y + (cy - f.y) * eased;
      const alpha = progress < 0.9 ? 1 : (1 - progress)/0.1;
      ctx.save(); ctx.globalAlpha = Math.max(0, alpha);
      ctx.font = `${f.size}px serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(f.emoji, fx, fy);
      ctx.restore();
    });

    // the growing blob
    drawCutsceneBlob(cx, cy, c.blobScale, c.blobAngle, t);

    // text
    const fadeIn = Math.min(1, t / 60);
    ctx.save(); ctx.globalAlpha = fadeIn;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 26px Segoe UI'; ctx.fillStyle='#a78bfa';
    ctx.shadowColor='#6c63ff'; ctx.shadowBlur=20;
    ctx.fillText('The Original... grows...', cx, 55);
    // size label
    const dispSize = Math.min(50, Math.round(1 + c.blobScale * 49));
    ctx.font='bold 20px Segoe UI'; ctx.fillStyle='#ffd700'; ctx.shadowBlur=10;
    ctx.fillText(`${dispSize}×`, cx, H - 44);
    ctx.restore();
  }

  // ── Phase 1: vortex suck-in ────────────────────────────────
  else if (phase === 1) {
    ctx.fillStyle='#020208'; ctx.fillRect(0,0,W,H);
    const vt = t - 360;
    // spinning vortex rings
    for (let ring = 8; ring >= 0; ring--) {
      const rFrac = ring / 8;
      const radius = (1 - rFrac) * Math.min(W,H)*0.48 + rFrac*10;
      const hue = 260 + ring*12;
      const alpha = 0.08 + rFrac*0.25;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(c.vortexAngle * (ring%2===0?1:-1) + ring*0.4);
      ctx.strokeStyle=`hsla(${hue},80%,60%,${alpha})`;
      ctx.lineWidth = 2+rFrac*6;
      ctx.beginPath(); ctx.arc(0,0,radius,0,Math.PI*1.7); ctx.stroke();
      ctx.restore();
    }
    // centre hole glow
    const holeGrad = ctx.createRadialGradient(cx,cy,0,cx,cy,120);
    holeGrad.addColorStop(0,'rgba(50,0,100,0.95)');
    holeGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=holeGrad; ctx.fillRect(0,0,W,H);

    // blob spiralling in
    if (c.blobScale > 0) {
      const spiral = vt * 2.5;
      const bx2 = cx + Math.cos(c.vortexAngle*3)*spiral*0.15;
      const by2 = cy + Math.sin(c.vortexAngle*3)*spiral*0.15;
      drawCutsceneBlob(bx2, by2, c.blobScale, c.vortexAngle*4, t);
    }

    ctx.save(); ctx.textAlign='center';
    ctx.font='bold 30px Segoe UI'; ctx.fillStyle='#dfe6e9';
    ctx.shadowColor='#a29bfe'; ctx.shadowBlur=20;
    ctx.fillText('A vortex opens...', cx, 55);
    ctx.restore();
  }

  // ── Phase 2: vast new world ────────────────────────────────
  else if (phase === 2) {
    const wt = t - 560;
    const fadeIn = Math.min(1, wt/60);

    // vast starfield bg
    ctx.fillStyle='#020210'; ctx.fillRect(0,0,W,H);
    ctx.save(); ctx.globalAlpha=fadeIn;
    c.starField.forEach(s => {
      // pan stars to suggest enormous scale
      const sx = ((s.x + W*3) % (W*6)) - W*2.5;
      const sy = ((s.y + H*3) % (H*6)) - H*2.5;
      // only draw stars visible on canvas
      if (sx < -10 || sx > W+10 || sy < -10 || sy > H+10) return;
      const twinkle = 0.5 + Math.sin(Date.now()*0.002 + s.bright*10)*0.5;
      ctx.fillStyle=`rgba(255,255,255,${twinkle*s.bright})`;
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,Math.PI*2); ctx.fill();
    });

    // gigantic ground grid suggesting vast scale
    ctx.strokeStyle=`rgba(100,100,255,${0.08*fadeIn})`;
    ctx.lineWidth=1;
    const gridSize = 80;
    for (let gx=0;gx<W;gx+=gridSize){ ctx.beginPath(); ctx.moveTo(gx,H*0.55); ctx.lineTo(gx,H); ctx.stroke(); }
    for (let gy=Math.floor(H*0.55);gy<H;gy+=gridSize){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke(); }

    // horizon glow
    const horizGrad = ctx.createLinearGradient(0,H*0.45,0,H*0.7);
    horizGrad.addColorStop(0,'rgba(108,99,255,0.25)');
    horizGrad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=horizGrad; ctx.fillRect(0,H*0.45,W,H*0.3);
    ctx.restore();

    // tiny blob in new world
    const tinyR = 18;
    drawCutsceneBlob(cx, H*0.72, 0.04, c.blobAngle, t);

    // scale markers showing how big the world is
    ctx.save(); ctx.globalAlpha=fadeIn;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 28px Segoe UI'; ctx.fillStyle='#a78bfa';
    ctx.shadowColor='#6c63ff'; ctx.shadowBlur=20;
    ctx.fillText('A new, bigger world...', cx, 55);
    ctx.font='18px Segoe UI'; ctx.fillStyle='#dfe6e9'; ctx.shadowBlur=0;
    ctx.fillText('Still 50× ...but the world is so much larger.', cx, 95);
    // arrow pointing to tiny blob
    ctx.fillStyle='#ffd700'; ctx.font='bold 15px Segoe UI';
    ctx.fillText('▼ that\'s you', cx, H*0.72 - tinyR - 28);
    ctx.restore();
  }

  // ── Phase 3: win screen ────────────────────────────────────
  else if (phase === 3) {
    ctx.fillStyle='#010108'; ctx.fillRect(0,0,W,H);
    c.starField.forEach(s => {
      const sx = ((s.x + W*3) % (W*6)) - W*2.5;
      const sy = ((s.y + H*3) % (H*6)) - H*2.5;
      if (sx<-10||sx>W+10||sy<-10||sy>H+10) return;
      const twinkle=0.5+Math.sin(Date.now()*0.002+s.bright*10)*0.5;
      ctx.fillStyle=`rgba(255,255,255,${twinkle*s.bright})`;
      ctx.beginPath(); ctx.arc(sx,sy,s.r,0,Math.PI*2); ctx.fill();
    });

    const hue = Date.now()*0.08%360;
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';

    ctx.font=`${Math.min(100,W*0.1)}px serif`;
    ctx.fillText('🏆', cx, H/2-160);

    ctx.font=`bold ${Math.min(72,W*0.07)}px Segoe UI`;
    ctx.fillStyle=`hsl(${hue},100%,65%)`;
    ctx.shadowColor=`hsl(${hue},100%,65%)`; ctx.shadowBlur=50;
    ctx.fillText('YOU WIN?', cx, H/2-60);

    ctx.shadowBlur=0; ctx.font='22px Segoe UI'; ctx.fillStyle='#b2bec3';
    ctx.fillText('The blob grows beyond imagination.', cx, H/2+10);
    ctx.fillText('But what lies further in this vast world...?', cx, H/2+44);

    ctx.font='bold 18px Segoe UI';
    ctx.fillStyle=`hsl(${hue},100%,72%)`;
    ctx.shadowColor=`hsl(${hue},100%,72%)`; ctx.shadowBlur=12;
    ctx.fillText('Click anywhere to return to main menu', cx, H/2+110);
    ctx.restore();
  }
}

function drawCutsceneBlob(x, y, scale, angle, t) {
  const maxR = Math.max(W, H) * 0.7; // max radius fills screen
  const r = maxR * scale;
  if (r < 1) return;

  ctx.save(); ctx.translate(x, y);
  const wb = 1 + Math.sin(t*0.05)*0.04;
  ctx.scale(wb, 1/wb);

  ctx.shadowColor='#6c63ff'; ctx.shadowBlur=Math.min(60, r*0.3);
  const grad = ctx.createRadialGradient(-r*0.25,-r*0.25,0,0,0,r);
  grad.addColorStop(0,'#c4b5fd'); grad.addColorStop(1,'#3b0764');
  ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;

  // eyes (only visible when not giant)
  if (r < W*0.4) {
    const eyeR = Math.max(3, r*0.16);
    const ex=Math.cos(angle)*r*0.3, ey=Math.sin(angle)*r*0.3;
    const esp=r*0.25;
    const px=-Math.sin(angle)*esp, py=Math.cos(angle)*esp;
    for(let s=-1;s<=1;s+=2){
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(ex+px*s,ey+py*s,eyeR,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#1a1a2e'; ctx.beginPath(); ctx.arc(ex+px*s+Math.cos(angle)*eyeR*0.4,ey+py*s+Math.sin(angle)*eyeR*0.4,eyeR*0.5,0,Math.PI*2); ctx.fill();
    }
    // happy mouth
    ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(2,r*0.06); ctx.lineCap='round';
    const mx2=Math.cos(angle)*r*0.42, my2=Math.sin(angle)*r*0.42;
    ctx.beginPath(); ctx.arc(mx2,my2,r*0.2,angle+0.15,angle+Math.PI-0.15); ctx.stroke();
  } else {
    // so big just show a subtle surface pattern
    ctx.strokeStyle='rgba(167,139,250,0.12)'; ctx.lineWidth=r*0.04;
    for(let i=1;i<=3;i++){
      ctx.beginPath(); ctx.arc(0,0,r*(0.3+i*0.2),0,Math.PI*2); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawAchievementToasts() {

// ── Achievements screen ───────────────────────────────────────
let achScrollY = 0;
let achMaxScroll = 0;
const ACH_LIST_TOP = 96, ACH_LIST_BOTTOM_PAD = 70;

function drawAchievements() {
  ctx.save();
  ctx.fillStyle = 'rgba(10,10,30,0.96)';
  ctx.fillRect(0, 0, W, H);
  ctx.font = 'bold 32px Segoe UI'; ctx.fillStyle = '#f59e0b';
  ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 20;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🏅 Achievements', W/2, 54);
  ctx.shadowBlur = 0;

  const cols = 2, cellW = (W-80)/cols, cellH = 68, padX = 40;
  const listBottom = H - ACH_LIST_BOTTOM_PAD;
  const rows = Math.ceil(ACHIEVEMENTS.length / cols);
  const contentH = rows * cellH;
  achMaxScroll = Math.max(0, contentH - (listBottom - ACH_LIST_TOP));
  achScrollY = Math.max(0, Math.min(achScrollY, achMaxScroll));

  ctx.save();
  ctx.beginPath(); ctx.rect(0, ACH_LIST_TOP - 6, W, listBottom - ACH_LIST_TOP + 6); ctx.clip();
  ACHIEVEMENTS.forEach((a, i) => {
    const col = i % cols, row = Math.floor(i / cols);
    const x = padX + col * cellW, y = ACH_LIST_TOP + row * cellH - achScrollY;
    if (y + cellH < ACH_LIST_TOP - 10 || y > listBottom + 10) return; // cull offscreen
    const done = unlockedAchievements.has(a.id);
    ctx.save();
    ctx.globalAlpha = done ? 1 : 0.4;
    ctx.fillStyle = done ? '#1e293b' : '#0f172a';
    ctx.strokeStyle = done ? '#f59e0b' : '#334155';
    ctx.lineWidth = done ? 2 : 1;
    ctx.beginPath(); ctx.roundRect(x, y, cellW-16, cellH-10, 10); ctx.fill(); ctx.stroke();
    const isSecret = a.secret && !done;
    ctx.font = '26px serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.fillText(done ? a.icon : '❓', x+14, y+(cellH-10)/2);
    ctx.font = 'bold 13px Segoe UI'; ctx.fillStyle = done ? '#fff' : '#64748b';
    ctx.fillText(a.name, x+52, y+20);
    ctx.font = '11px Segoe UI'; ctx.fillStyle = done ? '#94a3b8' : '#475569';
    ctx.fillText(isSecret ? 'Figure it out 😏' : a.desc, x+52, y+38);
    ctx.restore();
  });
  ctx.restore();

  // scroll indicator
  if (achMaxScroll > 0) {
    const trackH = listBottom - ACH_LIST_TOP;
    const thumbH = Math.max(24, trackH * (trackH / contentH));
    const thumbY = ACH_LIST_TOP + (trackH - thumbH) * (achScrollY / achMaxScroll);
    ctx.fillStyle = 'rgba(245,158,11,0.5)';
    ctx.beginPath(); ctx.roundRect(W - 14, thumbY, 6, thumbH, 3); ctx.fill();
  }

  const total = ACHIEVEMENTS.length, earned = unlockedAchievements.size;
  ctx.font = '14px Segoe UI'; ctx.fillStyle = '#64748b';
  ctx.textAlign = 'center';
  ctx.fillText(`${earned} / ${total} unlocked`, W/2, H-54);
  drawBtn(W/2-60, H-40, 120, 30, '← Back', '#334155', '#1e293b');
  ctx.restore();
}

function loop(ts) {
  update(ts);
  drawBg();

  if (gameState==='cutscene') {
    drawEndingCutscene();
  } else if (gameState==='menu') {
    drawMenu();
  } else if (gameMode==='foodrun' && gameState==='playing') {
    drawFoodRun();
  } else if (gameMode==='pt2' && gameState==='playing') {
    if(pt2) drawPt2();
  } else {
    if (gameState === 'win') {
      drawBlobs();
      drawParticles();
      drawIceCreamPlayer();
      drawFloatTexts();
      drawWinScreen();
    } else if (gameMode === 'secret') {
      drawBlobs();
      drawPurpleBoss();
      drawEatCutscene();
      drawParticles();
      drawIceCreamPlayer();
    } else {
      drawKetchup();
      drawGerms();
      drawPowerUps();
      foods.forEach(drawFood);
      drawMedicines();
      drawPizzaBoss();
      drawBurgerBoss();
      drawBacteriaBoss();
      drawPepperoni();
      drawMouths();
      drawTrailParticles();
      drawParticles();
      drawPlayer();
      drawActivePowerUpHUD();
      drawMedicineTimer();
      drawPoisonBanner();
      drawBacteriaBanner();
    }
    drawFloatTexts();
    if (gameState==='gameover') drawGameOver();
    if (gameState==='achievements') drawAchievements();
    if (gameState==='cosmetics') drawCosmetics();
  }
  drawAchievementToasts();
  drawMobileToggle();
  drawLeftHandToggle();
  drawSuggestionsBtn();
  drawJoystick();
  requestAnimationFrame(loop);
}

function pt2WS(wx,wy){return[wx-pt2.camX+W/2,wy-pt2.camY+H/2];}
function pt2Vis(wx,wy,m=100){const[sx,sy]=pt2WS(wx,wy);return sx>-m&&sx<W+m&&sy>-m&&sy<H+m;}
function pt2ZoneId(wx){for(const z of PT2_ZONES)if(wx>=z.x&&wx<z.x+z.w)return z.id;return 1;}
function pt2ZoneDef(id){return PT2_ZONES[id-1]||PT2_ZONES[0];}

function pt2PopulateWorld(){
  for(let i=0;i<100;i++)pt2SpawnFoodRnd(1);
  for(let i=0;i<16;i++)pt2SpawnPowerupRnd(false);
  pt2SpawnChests();
}

function pt2SpawnFoodRnd(zoneId){
  const z=pt2ZoneDef(zoneId);
  const wx=z.x+60+Math.random()*(z.w-120);
  const wy=60+Math.random()*(PT2_H-120);
  pt2AddFood(wx,wy,zoneId);
}

function pt2SpawnFoodInZone(zoneId){
  const z=pt2ZoneDef(zoneId);
  if(!z)return;
  for(let i=0;i<35;i++){
    const wx=z.x+60+Math.random()*(z.w-120);
    const wy=60+Math.random()*(PT2_H-120);
    pt2AddFood(wx,wy,zoneId);
  }
}

function pt2AddFood(wx,wy,zoneId){
  const roll=Math.random();
  let type,emoji;
  if(roll<0.04){type='golden';emoji=PT2_FOODS_GOLDEN[0|Math.random()*PT2_FOODS_GOLDEN.length];}
  else if(zoneId>=2&&roll<0.22){type='poison';emoji=PT2_FOODS_POISON[0|Math.random()*PT2_FOODS_POISON.length];}
  else if(zoneId>=2&&roll<0.32){
    type='moving';emoji=PT2_FOODS_MOVING[0|Math.random()*PT2_FOODS_MOVING.length];
    pt2.foods.push({wx,wy,type,emoji,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,pulseT:0,eaten:false});
    return;
  } else {type='normal';emoji=PT2_FOODS_NORMAL[0|Math.random()*PT2_FOODS_NORMAL.length];}
  pt2.foods.push({wx,wy,type,emoji,vx:0,vy:0,pulseT:0,eaten:false});
}

function pt2SpawnPowerupRnd(nearPlayer){
  const types=['speed','shield','fire','score2x','health','magnet'];
  const emojis={speed:'⚡',shield:'🛡️',fire:'🔥',score2x:'💰',health:'❤️',magnet:'🧲'};
  const type=types[0|Math.random()*types.length];
  let wx,wy;
  if(nearPlayer){
    wx=Math.max(50,Math.min(PT2_W-50,pt2.px+(Math.random()-.5)*500));
    wy=Math.max(50,Math.min(PT2_H-50,pt2.py+(Math.random()-.5)*500));
  } else {
    const maxZ=Math.max(...[...pt2.unlockedZones]);
    const z=pt2ZoneDef(maxZ);
    wx=PT2_ZONES[0].x+60+Math.random()*(z.x+z.w-120);
    wy=60+Math.random()*(PT2_H-120);
  }
  pt2.powerups.push({wx,wy,type,emoji:emojis[type],collected:false,pulseT:0});
}

function pt2SpawnChests(){
  const upgrades=['speed','radius','maxHealth','scoreBonus'];
  const icons={speed:'🦵',radius:'🍽️',maxHealth:'💪',scoreBonus:'⭐'};
  const names={speed:'Speed Up',radius:'Bigger Bite',maxHealth:'+Max HP',scoreBonus:'Score Bonus'};
  PT2_ZONES.forEach(z=>{
    for(let i=0;i<4;i++){
      const upg=upgrades[0|Math.random()*upgrades.length];
      pt2.chests.push({wx:z.x+100+Math.random()*(z.w-200),wy:80+Math.random()*(PT2_H-160),upgrade:upg,icon:icons[upg],name:names[upg],opened:false});
    }
  });
}

function pt2SetupPortals(){
  pt2.portals=[];
  for(let i=0;i<PT2_ZONES.length-1;i++){
    const boundary=PT2_ZONES[i].x+PT2_ZONES[i].w;
    pt2.portals.push({wx:boundary,wy:PT2_H/2,fromZone:i+1,toZone:i+2,locked:!pt2.unlockedZones.has(i+2),h:200});
  }
}

function pt2SpawnBoss(type){
  const def=PT2_BOSS_DEF[type];
  if(!def||pt2.bosses.length>=3)return;
  if(pt2.bosses.find(b=>b.type===type))return;
  const z=def.zone>0?pt2ZoneDef(def.zone):pt2ZoneDef(pt2.zone);
  // Spawn in far 40% of the zone so player must explore to find them
  const wx=z.x+z.w*0.6+Math.random()*z.w*0.35;
  const wy=PT2_H*0.1+Math.random()*PT2_H*0.8;
  pt2.bosses.push({
    type,wx,wy,vx:0,vy:0,hp:def.maxHp,maxHp:def.maxHp,...def,
    timer:0,attackCooldown:0,angle:0,orbitAngle:0,
    dashVx:0,dashVy:0,dashTimer:0,
    wasabiTrail:[],noodleAngle:0,
    chefPhase:0,chefPhaseAnnounced:0,
    jumpTimer:200,jumpVisible:true,
  });
  pt2.bossWarning={text:`⚠️ ${def.name} appeared!`,timer:200};
  setMusic('pt2_boss');
}

function pt2Announce(title,sub=''){pt2.zoneAnnounce={title,sub,timer:260};}

// ---- UPDATE ----
function updatePt2(){
  if(pt2.dead||pt2.victory){pt2UpdateParticles();return;}
  pt2UpdatePlayer();
  pt2UpdateCamera();
  pt2UpdateFoods();
  pt2UpdateBosses();
  pt2UpdateProjectiles();
  pt2UpdatePlayerBullets();
  pt2UpdatePowerups();
  pt2UpdateChests();
  pt2UpdateParticles();
  pt2UpdateTimers();
  pt2CheckPortals();
  if(pt2.zoneAnnounce&&--pt2.zoneAnnounce.timer<=0)pt2.zoneAnnounce=null;
  if(pt2.bossWarning&&--pt2.bossWarning.timer<=0)pt2.bossWarning=null;
  if(pt2.damageFlash>0)pt2.damageFlash--;
}

function pt2UpdatePlayer(){
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['a']||keys['A'])dx-=1;
  if(keys['ArrowRight']||keys['d']||keys['D'])dx+=1;
  if(keys['ArrowUp']||keys['w']||keys['W'])dy-=1;
  if(keys['ArrowDown']||keys['s']||keys['S'])dy+=1;
  if(mobileMode&&joystick.active){dx=joystick.dx;dy=joystick.dy;}
  const mag=Math.hypot(dx,dy);
  if(mag>0){dx/=mag;dy/=mag;pt2.lastAimX=dx;pt2.lastAimY=dy;}
  let spd=3.2+pt2.upgrades.speed*0.5;
  if(pt2.speedBoost>0)spd*=1.6;
  pt2.px+=dx*spd; pt2.py+=dy*spd;
  // Shoot — SPACE on keyboard
  if(pt2.shootCooldown>0)pt2.shootCooldown--;
  if((keys[' ']||keys['z']||keys['Z'])&&pt2.shootCooldown<=0)pt2PlayerShoot();
  // Clamp to unlocked world
  const maxX=pt2GetMaxX();
  pt2.px=Math.max(pt2.radius,Math.min(maxX-pt2.radius,pt2.px));
  pt2.py=Math.max(pt2.radius,Math.min(PT2_H-pt2.radius,pt2.py));
  if(pt2.shield>0)pt2.shield--;
  if(pt2.speedBoost>0)pt2.speedBoost--;
  if(pt2.fireImmune>0)pt2.fireImmune--;
  if(pt2.magnet>0)pt2.magnet--;
  if(pt2.invincible>0)pt2.invincible--;
  // Zone tracking
  const newZone=pt2ZoneId(pt2.px);
  if(newZone!==pt2.zone&&pt2.unlockedZones.has(newZone)){
    pt2.zone=newZone;
    if(!pt2.zonesVisited.has(newZone)){
      pt2.zonesVisited.add(newZone);
      const z=pt2ZoneDef(newZone);
      pt2Announce(z.name,pt2GetZoneHint(newZone));
      pt2TriggerZoneBosses(newZone);
      if(pt2.zonesVisited.size>=4){unlockAchievement('pt2_explorer');if(pt2.health>=pt2.maxHealth)unlockAchievement('pt2_survivor');}
    }
    setMusic(pt2ZoneDef(newZone).music||'pt2_field');
  }
}

function pt2GetMaxX(){
  let maxZ=1;
  for(const z of pt2.unlockedZones)maxZ=Math.max(maxZ,z);
  const zd=pt2ZoneDef(maxZ);
  return zd.x+zd.w-10;
}

function pt2GetZoneHint(z){
  return['','Defeat the Giant Donut!','Beware poison! Beat Sushi & Taco!','3 bosses block the path...','THE CHEF awaits. Good luck.'][z]||'';
}

function pt2TriggerZoneBosses(zoneId){
  const reqs=PT2_ZONE_REQS[zoneId];
  if(!reqs)return;
  reqs.forEach((bType,i)=>{
    if(!pt2.zoneBossesDefeated[zoneId].has(bType)){
      setTimeout(()=>{if(pt2&&!pt2.dead)pt2SpawnBoss(bType);},2000+i*1500);
    }
  });
}

function pt2UpdateCamera(){
  pt2.camX+=(pt2.px-pt2.camX)*0.09;
  pt2.camY+=(pt2.py-pt2.camY)*0.09;
  pt2.camX=Math.max(W/2,Math.min(PT2_W-W/2,pt2.camX));
  pt2.camY=Math.max(H/2,Math.min(PT2_H-H/2,pt2.camY));
}

function pt2UpdateFoods(){
  if(++pt2.foodTimer>=pt2.foodInterval&&pt2.foods.filter(f=>!f.eaten).length<90){
    const maxZ=Math.max(...[...pt2.unlockedZones]);
    pt2SpawnFoodRnd(maxZ);
    pt2.foodTimer=0;
  }
  const pr=pt2.radius+pt2.upgrades.radius*3;
  pt2.foods.forEach(f=>{
    if(f.eaten)return;
    f.pulseT+=0.05;
    if(f.type==='moving'){
      const dx=pt2.px-f.wx,dy=pt2.py-f.wy,d=Math.hypot(dx,dy)||1;
      if(d<220){f.vx-=(dx/d)*0.18;f.vy-=(dy/d)*0.18;}
      f.vx*=0.94;f.vy*=0.94;
      f.wx+=f.vx;f.wy+=f.vy;
      f.wx=Math.max(30,Math.min(PT2_W-30,f.wx));
      f.wy=Math.max(30,Math.min(PT2_H-30,f.wy));
    }
    if(pt2.magnet>0){
      const dx=pt2.px-f.wx,dy=pt2.py-f.wy,d=Math.hypot(dx,dy)||1;
      if(d<280){f.wx+=(dx/d)*6;f.wy+=(dy/d)*6;}
    }
    if(Math.hypot(pt2.px-f.wx,pt2.py-f.wy)<pr+16){
      if(f.type==='poison'&&!pt2.fireImmune){
        pt2TakeDamage(15);
        pt2FloatText(f.wx,f.wy,'-15💀','#ef4444');
        f.eaten=true;
      } else {
        f.eaten=true;
        const base=f.type==='golden'?60:f.type==='moving'?18:10;
        const pts=Math.round(base*pt2.scoreMulti*(1+pt2.upgrades.scoreBonus*0.25));
        pt2.score+=pts;
        pt2FloatText(f.wx,f.wy,'+'+pts,f.type==='golden'?'#fbbf24':'#4ade80');
        pt2P(f.wx,f.wy,f.type==='golden'?'#fbbf24':'#a3e635',5);
        pt2.radius=Math.min(40+pt2.upgrades.radius*3,pt2.radius+(f.type==='golden'?0.4:0.1));
      }
    }
  });
  pt2.foods=pt2.foods.filter(f=>!f.eaten);
}

function pt2UpdateBosses(){
  for(let i=pt2.bosses.length-1;i>=0;i--){
    const b=pt2.bosses[i];
    b.timer++;
    if(b.attackCooldown>0)b.attackCooldown--;
    const dx=pt2.px-b.wx,dy=pt2.py-b.wy,dist=Math.hypot(dx,dy)||1,nx=dx/dist,ny=dy/dist;

    if(b.type==='donut'){
      b.orbitAngle+=0.013;
      if(b.dashTimer>0){b.wx+=b.dashVx;b.wy+=b.dashVy;b.dashTimer--;}
      else{b.wx+=Math.cos(b.orbitAngle)*b.speed*0.5+nx*b.speed*0.4;b.wy+=Math.sin(b.orbitAngle)*b.speed*0.5+ny*b.speed*0.4;}
      if(b.attackCooldown<=0&&dist<400){b.dashVx=nx*7;b.dashVy=ny*7;b.dashTimer=28;b.attackCooldown=160;}
      if(b.timer%220===0){for(let a=0;a<8;a++){const ang=(a/8)*Math.PI*2;pt2Proj(b.wx,b.wy,Math.cos(ang)*3.2,Math.sin(ang)*3.2,'🟣',110);}}

    } else if(b.type==='sushi'){
      if(b.dashTimer>0){b.wx+=b.dashVx;b.wy+=b.dashVy;b.dashTimer--;if(b.dashTimer%7===0)b.wasabiTrail.push({wx:b.wx,wy:b.wy,life:130});}
      else{b.wx+=nx*b.speed;b.wy+=ny*b.speed;}
      if(b.attackCooldown<=0){b.dashVx=nx*9;b.dashVy=ny*9;b.dashTimer=22;b.attackCooldown=80;}
      b.wasabiTrail=b.wasabiTrail.filter(w=>--w.life>0);
      b.wasabiTrail.forEach(w=>{if(Math.hypot(pt2.px-w.wx,pt2.py-w.wy)<28&&pt2.invincible<=0)pt2TakeDamage(6);});

    } else if(b.type==='taco'){
      b.wx+=nx*b.speed*0.75;b.wy+=ny*b.speed*0.75;
      if(b.timer%110===0&&b.attackCooldown<=0){
        for(let s=-1;s<=1;s++){const a=Math.atan2(dy,dx)+s*0.45;pt2Proj(b.wx,b.wy,Math.cos(a)*4.5,Math.sin(a)*4.5,'🌮',75);}
        b.attackCooldown=110;
      }

    } else if(b.type==='cheese'){
      if(b.dashTimer<=0){const a=Math.random()*Math.PI*2;b.dashVx=Math.cos(a)*b.speed*1.8;b.dashVy=Math.sin(a)*b.speed*1.8;b.dashTimer=70+0|Math.random()*60;}
      b.wx+=b.dashVx;b.wy+=b.dashVy;b.dashTimer--;b.angle+=0.12;
      const z3=pt2ZoneDef(3);
      if(b.wx<z3.x+b.r){b.wx=z3.x+b.r;b.dashVx*=-1;}
      if(b.wx>z3.x+z3.w-b.r){b.wx=z3.x+z3.w-b.r;b.dashVx*=-1;}
      if(b.wy<b.r){b.wy=b.r;b.dashVy*=-1;}
      if(b.wy>PT2_H-b.r){b.wy=PT2_H-b.r;b.dashVy*=-1;}

    } else if(b.type==='ramen'){
      b.wx+=nx*b.speed*0.35;b.wy+=ny*b.speed*0.35;
      b.noodleAngle+=0.028;
      if(b.timer%85===0){for(let n=0;n<4;n++){const a=b.noodleAngle+(n/4)*Math.PI*2;pt2Proj(b.wx+Math.cos(a)*b.r,b.wy+Math.sin(a)*b.r,Math.cos(a+Math.PI/2)*4,Math.sin(a+Math.PI/2)*4,'〰️',95);}}

    } else if(b.type==='pineapple'){
      b.jumpTimer--;
      if(b.jumpTimer<=0){
        b.wx=Math.max(50,Math.min(PT2_W-50,pt2.px+(Math.random()-.5)*180));
        b.wy=Math.max(50,Math.min(PT2_H-50,pt2.py+(Math.random()-.5)*180));
        b.jumpTimer=200;
        for(let s=0;s<7;s++){const a=-Math.PI/2+(s-3)*0.3;pt2Proj(b.wx,b.wy,Math.cos(a)*3.5,Math.sin(a)*3.5,'🟡',85);}
        pt2P(b.wx,b.wy,'#f59e0b',12);
      }
      b.wx+=nx*b.speed*0.5;b.wy+=ny*b.speed*0.5;

    } else if(b.type==='chef'){
      const hpFrac=b.hp/b.maxHp;
      const phase=hpFrac>0.66?0:hpFrac>0.33?1:2;
      if(phase!==b.chefPhase){
        b.chefPhase=phase;
        pt2FloatText(b.wx,b.wy-60,['','⚡ PHASE 2!','🔥 FINAL PHASE!'][phase],'#ff0');
        pt2.bossWarning={text:['','⚡ The Chef — Phase 2!','🔥 The Chef — FINAL PHASE!'][phase],timer:220};
      }
      const spd2=b.speed*(1+phase*0.45);
      if(b.dashTimer>0){b.wx+=b.dashVx;b.wy+=b.dashVy;b.dashTimer--;}
      else{b.wx+=nx*spd2;b.wy+=ny*spd2;}
      if(b.timer%(100-phase*22)===0&&b.attackCooldown<=0){
        if(phase===0){for(let a=0;a<5;a++){const ang=Math.atan2(dy,dx)+(a-2)*0.38;pt2Proj(b.wx,b.wy,Math.cos(ang)*4,Math.sin(ang)*4,'🧪',85);}}
        else if(phase===1){for(let a=0;a<8;a++){const ang=b.timer*0.06+(a/8)*Math.PI*2;pt2Proj(b.wx,b.wy,Math.cos(ang)*5.5,Math.sin(ang)*5.5,'🍳',75);}b.dashVx=nx*10;b.dashVy=ny*10;b.dashTimer=18;}
        else{for(let a=0;a<14;a++){const ang=(a/14)*Math.PI*2;pt2Proj(b.wx,b.wy,Math.cos(ang)*6.5,Math.sin(ang)*6.5,'🔪',100);}}
        b.attackCooldown=55-phase*8;
      }

    } else {
      // Mini-boss generic AI
      b.wx+=nx*b.speed;b.wy+=ny*b.speed;
      b.angle+=0.08;
      if(b.type==='hotdog'&&b.attackCooldown<=0&&dist<320){b.dashVx=nx*11;b.dashVy=ny*11;b.dashTimer=20;b.attackCooldown=110;}
      if(b.type==='cake'&&b.timer%120===0){for(let a=0;a<6;a++){const ang=(a/6)*Math.PI*2;pt2Proj(b.wx,b.wy,Math.cos(ang)*3,Math.sin(ang)*3,'🎂',80);}}
      if(b.dashTimer>0){b.wx+=b.dashVx;b.wy+=b.dashVy;b.dashTimer--;}
    }

    b.wx=Math.max(b.r,Math.min(PT2_W-b.r,b.wx));
    b.wy=Math.max(b.r,Math.min(PT2_H-b.r,b.wy));

    // Contact — boss hurts player
    if(Math.hypot(pt2.px-b.wx,pt2.py-b.wy)<pt2.radius+b.r+4&&pt2.invincible<=0){
      if(pt2.shield>0){pt2.shield=0;pt2FloatText(pt2.px,pt2.py-40,'SHIELD!','#60a5fa');pt2P(pt2.px,pt2.py,'#60a5fa',8);}
      else pt2TakeDamage(22);
    }
    // Player damages boss on collision
    if(Math.hypot(pt2.px-b.wx,pt2.py-b.wy)<pt2.radius+b.r-4&&pt2.invincible===0){
      const dmg=Math.max(1,Math.round(pt2.radius*0.35));
      b.hp-=dmg;
      pt2.invincible=22;
      pt2P(b.wx,b.wy,'#fff',4);
    }
    if(b.hp<=0){pt2BossDefeated(b);pt2.bosses.splice(i,1);}
  }
}

function pt2Proj(wx,wy,vx,vy,emoji,life){pt2.projectiles.push({wx,wy,vx,vy,emoji,r:13,life});}

function pt2PlayerShoot(){
  const spd=9+pt2.upgrades.speed*0.5;
  const dmg=18+pt2.upgrades.scoreBonus*6;
  const emoji=PT2_FOODS_NORMAL[0|Math.random()*PT2_FOODS_NORMAL.length];
  pt2.playerBullets.push({wx:pt2.px,wy:pt2.py,vx:pt2.lastAimX*spd,vy:pt2.lastAimY*spd,emoji,r:14,life:90,dmg});
  pt2.shootCooldown=22;
  sfx(520,'sine',0.07,0.18,800);
}

function pt2UpdatePlayerBullets(){
  for(let i=pt2.playerBullets.length-1;i>=0;i--){
    const b=pt2.playerBullets[i];
    b.wx+=b.vx; b.wy+=b.vy; b.life--;
    let hit=false;
    for(const boss of pt2.bosses){
      if(Math.hypot(b.wx-boss.wx,b.wy-boss.wy)<boss.r+b.r){
        boss.hp-=b.dmg;
        pt2P(boss.wx,boss.wy,'#fca5a5',4);
        pt2FloatText(boss.wx,boss.wy-24,'-'+b.dmg,'#f87171');
        pt2.shotsHit++;
        if(pt2.shotsHit>=50)unlockAchievement('pt2_sharpshooter');
        hit=true; break;
      }
    }
    if(hit||b.life<=0||b.wx<0||b.wx>PT2_W||b.wy<0||b.wy>PT2_H)
      pt2.playerBullets.splice(i,1);
  }
}

function pt2BossDefeated(b){
  pt2FloatText(b.wx,b.wy,'💥 DEFEATED!','#fbbf24');
  pt2P(b.wx,b.wy,'#fbbf24',24);
  pt2.score+=b.zone===0?300:600;
  pt2.totalBossesDefeated=(pt2.totalBossesDefeated||0)+1;
  if(pt2.noDamageBoss){unlockAchievement('pt2_untouchable');}
  pt2.noDamageBoss=true;
  unlockAchievement('pt2_boss');
  if(pt2.totalBossesDefeated>=10)unlockAchievement('pt2_10bosses');
  // Return to zone music if no more bosses
  if(pt2.bosses.length<=1) setMusic(pt2ZoneDef(pt2.zone).music||'pt2_field');
  if(b.zone>0){
    pt2.zoneBossesDefeated[b.zone].add(b.type);
    const reqs=PT2_ZONE_REQS[b.zone];
    if(reqs&&reqs.every(t=>pt2.zoneBossesDefeated[b.zone].has(t))){
      const keyZone=b.zone;
      setTimeout(()=>{
        if(!pt2)return;
        pt2.powerups.push({wx:b.wx,wy:b.wy,type:'key',emoji:'🗝️',collected:false,pulseT:0,keyZone});
        pt2.bossWarning={text:`🗝️ Zone ${keyZone} Key dropped!`,timer:260};
        if(keyZone===3){
          setTimeout(()=>{
            if(!pt2||pt2.dead)return;
            pt2.unlockedZones.add(4);
            pt2SetupPortals();
            pt2SpawnFoodInZone(4);
            setTimeout(()=>{if(pt2&&!pt2.dead)pt2SpawnBoss('chef');},2000);
            pt2.bossWarning={text:'👨‍🍳 THE CHEF has appeared in the Final Kitchen!',timer:320};
          },3500);
        }
      },500);
    }
  } else {
    pt2SpawnPowerupRnd(true);
  }
  if(b.type==='chef'){setTimeout(()=>{if(pt2)pt2Victory();},2200);}
}

function pt2UpdateProjectiles(){
  pt2.projectiles.forEach(p=>{
    p.wx+=p.vx;p.wy+=p.vy;p.life--;
    if(Math.hypot(pt2.px-p.wx,pt2.py-p.wy)<pt2.radius+p.r&&pt2.invincible<=0){
      if(pt2.shield>0){pt2.shield=0;}else pt2TakeDamage(12);
      p.life=0;
    }
  });
  pt2.projectiles=pt2.projectiles.filter(p=>p.life>0&&p.wx>0&&p.wx<PT2_W&&p.wy>0&&p.wy<PT2_H);
}

function pt2UpdatePowerups(){
  pt2.powerups.forEach(pu=>{
    if(pu.collected)return;
    pu.pulseT+=0.05;
    if(pt2.magnet>0){
      const dx=pt2.px-pu.wx,dy=pt2.py-pu.wy,d=Math.hypot(dx,dy)||1;
      if(d<260){pu.wx+=(dx/d)*6;pu.wy+=(dy/d)*6;}
    }
    if(Math.hypot(pt2.px-pu.wx,pt2.py-pu.wy)<pt2.radius+26){pu.collected=true;pt2CollectPowerup(pu);}
  });
  pt2.powerups=pt2.powerups.filter(p=>!p.collected);
}

function pt2CollectPowerup(pu){
  pt2P(pu.wx,pu.wy,'#fff',8);
  switch(pu.type){
    case 'speed':   pt2.speedBoost=600;pt2FloatText(pu.wx,pu.wy,'⚡ SPEED!','#fbbf24');break;
    case 'shield':  pt2.shield=500;pt2FloatText(pu.wx,pu.wy,'🛡️ SHIELD!','#60a5fa');break;
    case 'fire':    pt2.fireImmune=720;pt2FloatText(pu.wx,pu.wy,'🔥 FIRE IMMUNE!','#f97316');break;
    case 'score2x': pt2.scoreMulti=2;pt2.scoreMutliTimer=0;pt2FloatText(pu.wx,pu.wy,'💰 2× SCORE!','#fbbf24');break;
    case 'health':  pt2.health=Math.min(pt2.maxHealth,pt2.health+35);pt2FloatText(pu.wx,pu.wy,'❤️ +35 HP!','#f43f5e');break;
    case 'magnet':  pt2.magnet=620;pt2FloatText(pu.wx,pu.wy,'🧲 MAGNET!','#a78bfa');break;
    case 'key':
      const kz=pu.keyZone;
      pt2.keysHeld.add(kz);
      const portal=pt2.portals.find(p=>p.fromZone===kz);
      if(portal){portal.locked=false;}
      pt2.unlockedZones.add(kz+1);
      pt2FloatText(pu.wx,pu.wy,`🗝️ Zone ${kz+1} Unlocked!`,'#fbbf24');
      pt2Announce(pt2ZoneDef(kz+1).name,pt2GetZoneHint(kz+1));
      pt2SpawnFoodInZone(kz+1);
      break;
  }
}

function pt2UpdateChests(){
  pt2.chests.forEach(c=>{
    if(c.opened)return;
    if(Math.hypot(pt2.px-c.wx,pt2.py-c.wy)<pt2.radius+30){
      c.opened=true;
      const upg=c.upgrade;
      if(upg==='maxHealth'){pt2.upgrades.maxHealth=Math.min(4,pt2.upgrades.maxHealth+1);pt2.maxHealth=100+pt2.upgrades.maxHealth*20;pt2.health=Math.min(pt2.maxHealth,pt2.health+20);}
      else pt2.upgrades[upg]=Math.min(4,pt2.upgrades[upg]+1);
      pt2FloatText(c.wx,c.wy,`📦 ${c.name}!`,'#fbbf24');
      pt2P(c.wx,c.wy,'#fbbf24',14);
    }
  });
}

function pt2UpdateTimers(){
  if(++pt2.miniBossTimer>=pt2.miniBossInterval&&pt2.bosses.length<3){
    pt2.miniBossTimer=0;
    pt2SpawnBoss(PT2_MINI_POOL[0|Math.random()*PT2_MINI_POOL.length]);
  }
  if(pt2.scoreMulti>1&&++pt2.scoreMutliTimer>=1200){pt2.scoreMulti=1;pt2.scoreMutliTimer=0;}
  if(pt2.powerups.length<6&&Math.random()<0.004)pt2SpawnPowerupRnd(false);
}

function pt2CheckPortals(){
  pt2.portals.forEach(portal=>{
    if(portal.locked)return;
    if(Math.abs(pt2.px-portal.wx)<32&&Math.abs(pt2.py-portal.wy)<portal.h/2){
      const tz=pt2ZoneDef(portal.toZone);
      pt2.px=tz.x+80;pt2.py=portal.wy;
      pt2.camX=pt2.px;pt2.camY=pt2.py;
    }
  });
}

function pt2TakeDamage(amt){
  if(pt2.invincible>0)return;
  pt2.health-=amt;
  pt2.invincible=65;pt2.damageFlash=14;
  pt2P(pt2.px,pt2.py,'#ef4444',8);
  if(pt2.health<=0){pt2.health=0;pt2.dead=true;}
}

function pt2FloatText(wx,wy,text,color='#fff'){
  const[sx,sy]=pt2WS(wx,wy);
  pt2.floatTexts.push({sx,sy,text,color,life:1,vy:-1.5});
}

function pt2P(wx,wy,color,count=6){
  for(let i=0;i<count;i++){
    const a=Math.random()*Math.PI*2,spd=1+Math.random()*3.5;
    pt2.particles.push({wx,wy,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,color,life:1,size:2+Math.random()*5});
  }
}

function pt2UpdateParticles(){
  pt2.particles.forEach(p=>{p.wx+=p.vx;p.wy+=p.vy;p.vy+=0.06;p.life-=0.025;});
  pt2.particles=pt2.particles.filter(p=>p.life>0);
  pt2.floatTexts.forEach(t=>{t.sy+=t.vy;t.life-=0.019;});
  pt2.floatTexts=pt2.floatTexts.filter(t=>t.life>0);
}

function pt2Victory(){
  pt2.victory=true;
  unlockAchievement('pt2_clear');
  saveProgress();
}

// ---- DRAW ----
function drawPt2(){
  ctx.save();
  // Zone backgrounds
  PT2_ZONES.forEach(z=>{
    const[sx]=pt2WS(z.x,0);
    if(sx+z.w<-200||sx>W+200)return;
    ctx.fillStyle=z.bg;ctx.fillRect(sx,0,z.w,H);
    // Grid dots
    ctx.globalAlpha=0.055;ctx.fillStyle=z.accent;
    for(let gx=0;gx<z.w;gx+=65){for(let gy=0;gy<PT2_H;gy+=65){const[dgx,dgy]=pt2WS(z.x+gx,gy);if(dgx>-5&&dgx<W+5&&dgy>-5&&dgy<H+5){ctx.beginPath();ctx.arc(dgx,dgy,2.5,0,Math.PI*2);ctx.fill();}}}
    ctx.globalAlpha=1;
    // Zone label
    const[znx]=pt2WS(z.x+z.w/2,0);
    ctx.font='bold 12px sans-serif';ctx.fillStyle=z.accent;ctx.globalAlpha=0.35;ctx.textAlign='center';
    ctx.fillText(z.name,znx,20);ctx.globalAlpha=1;
    // Zone boundary line
    const[bsx]=pt2WS(z.x,0);
    ctx.strokeStyle=z.accent+'44';ctx.lineWidth=2;ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.moveTo(bsx,0);ctx.lineTo(bsx,H);ctx.stroke();
    ctx.setLineDash([]);
  });

  // Portals / walls
  pt2.portals.forEach(portal=>{
    if(!pt2Vis(portal.wx,portal.wy,300))return;
    const[sx,sy]=pt2WS(portal.wx,portal.wy);
    const ph=portal.h;
    if(portal.locked){
      ctx.fillStyle='#1e293b';ctx.fillRect(sx-14,0,28,sy-ph/2);ctx.fillRect(sx-14,sy+ph/2,28,H-(sy+ph/2));
      ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🔒',sx,sy);
    } else {
      const grad=ctx.createLinearGradient(sx-22,0,sx+22,0);
      grad.addColorStop(0,'rgba(251,191,36,0)');grad.addColorStop(0.5,'rgba(251,191,36,0.35)');grad.addColorStop(1,'rgba(251,191,36,0)');
      ctx.fillStyle=grad;ctx.fillRect(sx-22,sy-ph/2,44,ph);
      ctx.globalAlpha=0.6+Math.sin(Date.now()*0.005)*0.4;
      ctx.font='20px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('✨',sx,sy);
      ctx.globalAlpha=1;
    }
  });

  // Chests
  pt2.chests.forEach(c=>{
    if(!pt2Vis(c.wx,c.wy))return;
    const[sx,sy]=pt2WS(c.wx,c.wy);
    if(c.opened){ctx.globalAlpha=0.25;ctx.font='26px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('📭',sx,sy);ctx.globalAlpha=1;}
    else{
      const bob=Math.sin(Date.now()*0.003)*3;
      ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('📦',sx,sy+bob);
      ctx.font='14px serif';ctx.fillText(c.icon,sx+16,sy+bob-16);
    }
  });

  // Power-ups
  pt2.powerups.forEach(pu=>{
    if(!pt2Vis(pu.wx,pu.wy))return;
    const[sx,sy]=pt2WS(pu.wx,pu.wy);
    const bob=Math.sin(Date.now()*0.004+pu.pulseT)*6;
    ctx.save();
    ctx.globalAlpha=0.35+Math.abs(Math.sin(pu.pulseT*2))*0.35;
    ctx.fillStyle=pu.type==='key'?'#fbbf24':'#fff';
    ctx.beginPath();ctx.arc(sx,sy+bob,22,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;ctx.font='24px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pu.emoji,sx,sy+bob);ctx.restore();
  });

  // Foods
  pt2.foods.forEach(f=>{
    if(!pt2Vis(f.wx,f.wy))return;
    const[sx,sy]=pt2WS(f.wx,f.wy);
    if(f.type==='poison'){
      const fl=Math.sin(f.pulseT*4)*0.35+0.65;
      ctx.globalAlpha=fl*0.4;ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(sx,sy,16,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    } else if(f.type==='golden'){
      ctx.save();ctx.globalAlpha=Math.abs(Math.sin(f.pulseT))*0.5+0.3;ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(sx,sy,20,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.restore();
    }
    ctx.font='22px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(f.emoji,sx,sy);
  });

  // Projectiles
  pt2.projectiles.forEach(p=>{
    if(!pt2Vis(p.wx,p.wy))return;
    const[sx,sy]=pt2WS(p.wx,p.wy);
    ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.emoji,sx,sy);
  });

  // Wasabi trails
  pt2.bosses.forEach(b=>{
    if(!b.wasabiTrail)return;
    b.wasabiTrail.forEach(w=>{
      if(!pt2Vis(w.wx,w.wy))return;
      const[sx,sy]=pt2WS(w.wx,w.wy);
      ctx.globalAlpha=w.life/130*0.55;ctx.fillStyle='#4ade80';ctx.beginPath();ctx.arc(sx,sy,13,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
    });
  });

  // Bosses
  pt2.bosses.forEach(b=>{
    if(!pt2Vis(b.wx,b.wy))return;
    if(b.type==='pineapple'&&!b.jumpVisible)return;
    const[sx,sy]=pt2WS(b.wx,b.wy);
    ctx.save();
    const grad=ctx.createRadialGradient(sx,sy,b.r*0.4,sx,sy,b.r*1.8);
    grad.addColorStop(0,b.color+'77');grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(sx,sy,b.r*1.8,0,Math.PI*2);ctx.fill();
    if(b.type==='cheese'){ctx.translate(sx,sy);ctx.rotate(b.angle);ctx.font=`${b.r*1.5}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.emoji,0,0);}
    else{ctx.font=`${b.r*1.4}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.emoji,sx,sy);}
    ctx.restore();
    // HP bar
    const bw=b.r*3.2,bh=8,bx=sx-bw/2,by=sy-b.r*1.7-4;
    ctx.fillStyle='#1e293b';ctx.fillRect(bx,by,bw,bh);
    const hf=Math.max(0,b.hp/b.maxHp);
    ctx.fillStyle=hf>0.5?'#4ade80':hf>0.25?'#fbbf24':'#ef4444';ctx.fillRect(bx,by,bw*hf,bh);
    ctx.strokeStyle='#ffffff25';ctx.lineWidth=1;ctx.strokeRect(bx,by,bw,bh);
    ctx.font='bold 10px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(b.name,sx,by-3);
  });

  // Particles
  pt2.particles.forEach(p=>{
    if(!pt2Vis(p.wx,p.wy,20))return;
    const[sx,sy]=pt2WS(p.wx,p.wy);
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(sx,sy,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  });

  // Player bullets
  pt2.playerBullets.forEach(b=>{
    if(!pt2Vis(b.wx,b.wy))return;
    const[sx,sy]=pt2WS(b.wx,b.wy);
    ctx.font='18px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.save();ctx.globalAlpha=0.9;ctx.fillText(b.emoji,sx,sy);ctx.restore();
  });

  // Player
  {
    const[sx,sy]=pt2WS(pt2.px,pt2.py);const r=pt2.radius;
    if(pt2.shield>0){
      ctx.save();ctx.globalAlpha=0.38+Math.sin(Date.now()*0.012)*0.18;
      ctx.strokeStyle='#60a5fa';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sx,sy,r+14,0,Math.PI*2);ctx.stroke();ctx.restore();
    }
    if(pt2.invincible>0&&Math.floor(Date.now()/75)%2===0){ctx.restore();return;}
    const sw=SWATCHES[selectedSwatch];
    const aimA=Math.atan2(pt2.lastAimY,pt2.lastAimX);
    ctx.save();
    ctx.translate(sx,sy);
    ctx.shadowColor=sw.l;ctx.shadowBlur=18;
    drawPlayerBody(r,1,1,sw);
    ctx.shadowBlur=0;
    // Eyes facing aim direction
    const ex=Math.cos(aimA)*r*0.34,ey=Math.sin(aimA)*r*0.34;
    const esp=r*0.27,px2=-Math.sin(aimA)*esp,py2=Math.cos(aimA)*esp;
    for(let s=-1;s<=1;s+=2){
      const ex2=ex+px2*s,ey2=ey+py2*s;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex2,ey2,r*0.17,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#222';ctx.beginPath();ctx.arc(ex2+Math.cos(aimA)*r*0.05,ey2+Math.sin(aimA)*r*0.05,r*0.085,0,Math.PI*2);ctx.fill();
    }
    // Shoot cooldown arc indicator
    if(pt2.shootCooldown>0){
      ctx.globalAlpha=0.45;ctx.strokeStyle='#fff';ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(0,0,r+6,(pt2.shootCooldown/22)*Math.PI*2-Math.PI/2,-Math.PI/2);ctx.stroke();
      ctx.globalAlpha=1;
    }
    ctx.restore();
  }

  // Damage flash overlay
  if(pt2.damageFlash>0){ctx.globalAlpha=pt2.damageFlash/14*0.4;ctx.fillStyle='#ef4444';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}

  // Float texts
  pt2.floatTexts.forEach(t=>{
    ctx.globalAlpha=t.life;ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.fillStyle=t.color;ctx.fillText(t.text,t.sx,t.sy);ctx.globalAlpha=1;
  });

  ctx.restore();
  drawPt2HUD();
  if(pt2.dead)drawPt2Death();
  if(pt2.victory)drawPt2Victory();
}

function drawPt2HUD(){
  // Health bar
  const hbw=180,hbh=15,hbx=12,hby=H-34;
  ctx.fillStyle='#0f172a';ctx.fillRect(hbx,hby,hbw,hbh);
  const hf=pt2.health/pt2.maxHealth;
  ctx.fillStyle=hf>0.5?'#4ade80':hf>0.25?'#fbbf24':'#ef4444';ctx.fillRect(hbx,hby,hbw*hf,hbh);
  ctx.strokeStyle='#ffffff33';ctx.lineWidth=1;ctx.strokeRect(hbx,hby,hbw,hbh);
  ctx.font='10px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='left';
  ctx.fillText(`❤️ ${Math.ceil(pt2.health)}/${pt2.maxHealth}`,hbx+4,hby+11);
  // Score
  ctx.font='bold 17px sans-serif';ctx.textAlign='right';ctx.fillStyle='#fbbf24';
  ctx.fillText(`⭐ ${pt2.score}`,W-12,26);
  // Zone
  const cz=PT2_ZONES[pt2.zone-1];
  ctx.font='13px sans-serif';ctx.textAlign='left';ctx.fillStyle=cz?.accent||'#fff';
  ctx.fillText(cz?.name||'',12,22);
  // Effects
  let ex=12;
  const efx=[];
  if(pt2.shield>0)efx.push({e:'🛡️',t:Math.ceil(pt2.shield/60)+'s'});
  if(pt2.speedBoost>0)efx.push({e:'⚡',t:Math.ceil(pt2.speedBoost/60)+'s'});
  if(pt2.fireImmune>0)efx.push({e:'🔥',t:Math.ceil(pt2.fireImmune/60)+'s'});
  if(pt2.scoreMulti>1)efx.push({e:'💰',t:'2×'});
  if(pt2.magnet>0)efx.push({e:'🧲',t:Math.ceil(pt2.magnet/60)+'s'});
  efx.forEach(ef=>{
    ctx.fillStyle='rgba(0,0,0,0.55)';ctx.fillRect(ex,H-58,46,22);
    ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(`${ef.e}${ef.t}`,ex+23,H-43);ex+=50;
  });
  // Keys
  if(pt2.keysHeld.size>0){
    ctx.font='15px sans-serif';ctx.textAlign='right';let kx=W-12;
    [...pt2.keysHeld].forEach(k=>{ctx.fillStyle='#fbbf24';ctx.fillText(`🗝️Z${k}`,kx,H-12);kx-=45;});
  }
  // Mobile shoot button
  if(mobileMode){
    const bx=shootBtnX2(),by=H-SHOOT_BTN_R-24;
    ctx.save();
    const coolFrac=pt2.shootCooldown/22;
    ctx.globalAlpha=0.75;
    ctx.fillStyle=coolFrac>0?'#374151':'#16a34a';
    ctx.beginPath();ctx.arc(bx,by,SHOOT_BTN_R,0,Math.PI*2);ctx.fill();
    if(coolFrac>0){
      ctx.fillStyle='#4ade80';
      ctx.beginPath();ctx.moveTo(bx,by);ctx.arc(bx,by,SHOOT_BTN_R,-Math.PI/2,-Math.PI/2+2*Math.PI*(1-coolFrac));ctx.closePath();ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.font=`${SHOOT_BTN_R*1.1}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🍕',bx,by);
    ctx.restore();
  }
  // Boss warning
  if(pt2.bossWarning){
    const al=Math.min(1,pt2.bossWarning.timer/60);
    ctx.globalAlpha=al;ctx.font='bold 19px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fbbf24';
    ctx.fillText(pt2.bossWarning.text,W/2,H/2-90);ctx.globalAlpha=1;
  }
  // Zone announcement
  if(pt2.zoneAnnounce){
    const al=Math.min(1,pt2.zoneAnnounce.timer/60)*Math.min(1,(260-pt2.zoneAnnounce.timer)/30);
    ctx.globalAlpha=al;
    ctx.font='bold 26px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';
    ctx.fillText(pt2.zoneAnnounce.title,W/2,H/2-18);
    ctx.font='15px sans-serif';ctx.fillStyle='#94a3b8';
    ctx.fillText(pt2.zoneAnnounce.sub||'',W/2,H/2+16);ctx.globalAlpha=1;
  }
  // Mini-map
  drawPt2Minimap();
}

function drawPt2Minimap(){
  const mw=130,mh=72,mx=W-143,my=34;
  ctx.save();ctx.globalAlpha=0.78;
  ctx.fillStyle='#0f172a';ctx.fillRect(mx,my,mw,mh);
  ctx.strokeStyle='#334155';ctx.lineWidth=1;ctx.strokeRect(mx,my,mw,mh);
  PT2_ZONES.forEach(z=>{
    const zx=mx+(z.x/PT2_W)*mw,zw=(z.w/PT2_W)*mw;
    ctx.fillStyle=z.bg;ctx.fillRect(zx,my,zw,mh);
    if(!pt2.unlockedZones.has(z.id)){ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(zx,my,zw,mh);}
    ctx.strokeStyle=z.accent+'55';ctx.lineWidth=1;ctx.strokeRect(zx,my,zw,mh);
  });
  // Boss dots
  pt2.bosses.forEach(b=>{
    const bx=mx+(b.wx/PT2_W)*mw,by2=my+(b.wy/PT2_H)*mh;
    ctx.fillStyle='#ef4444';ctx.beginPath();ctx.arc(bx,by2,4,0,Math.PI*2);ctx.fill();
  });
  // Power-up dots
  pt2.powerups.filter(p=>p.type==='key').forEach(p=>{
    const px2=mx+(p.wx/PT2_W)*mw,py2=my+(p.wy/PT2_H)*mh;
    ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(px2,py2,3,0,Math.PI*2);ctx.fill();
  });
  // Player
  const ppx=mx+(pt2.px/PT2_W)*mw,ppy=my+(pt2.py/PT2_H)*mh;
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ppx,ppy,3.5,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ctx.restore();
}

function drawPt2Death(){
  ctx.fillStyle='rgba(0,0,0,0.72)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillStyle='#ef4444';
  ctx.fillText('💀 YOU WERE EATEN',W/2,H/2-32);
  ctx.font='20px sans-serif';ctx.fillStyle='#94a3b8';
  ctx.fillText(`Final Score: ${pt2.score}`,W/2,H/2+8);
  ctx.font='15px sans-serif';ctx.fillStyle='#64748b';
  ctx.fillText('Tap / click to return to menu',W/2,H/2+48);
}

function drawPt2Victory(){
  ctx.fillStyle='rgba(0,0,0,0.82)';ctx.fillRect(0,0,W,H);
  ctx.font='bold 36px sans-serif';ctx.textAlign='center';ctx.fillStyle='#fbbf24';
  ctx.fillText('🏆 THE CHEF IS DEFEATED!',W/2,H/2-52);
  ctx.font='22px sans-serif';ctx.fillStyle='#4ade80';
  ctx.fillText('Munch Munch Pt 2 — Complete!',W/2,H/2-12);
  ctx.font='20px sans-serif';ctx.fillStyle='#fff';
  ctx.fillText(`Final Score: ${pt2.score}`,W/2,H/2+28);
  ctx.font='15px sans-serif';ctx.fillStyle='#64748b';
  ctx.fillText('Tap / click to return to menu',W/2,H/2+68);
}
// =============================================
// END MUNCH MUNCH PT 2
// =============================================

timerStat.style.display='none';
requestAnimationFrame(loop);
</script>
